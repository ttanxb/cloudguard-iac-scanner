name: CloudGuard CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v
      - name: Self-scan sample (insecure file must fail)
        run: python -c "from scanner import scan; r=scan(open('samples/insecure.tf').read()); print('Score', r['score'], r['grade']); assert r['grade']=='F'"
      - name: Build Docker image
        run: docker build -t cloudguard .
